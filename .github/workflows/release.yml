name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Maintains the release pull request; tags + creates the GitHub Release
      # when that pull request is merged. `tag` is non-empty only on that merge.
      - id: tagpr
        uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
        if: steps.tagpr.outputs.tag != ''

      - uses: actions/setup-node@v6
        if: steps.tagpr.outputs.tag != ''
        with:
          node-version: 24.18.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - if: steps.tagpr.outputs.tag != ''
        run: pnpm install --frozen-lockfile

      - if: steps.tagpr.outputs.tag != ''
        run: pnpm build

      # Trusted Publishing (OIDC) — no NPM_TOKEN. Provenance comes from
      # publishConfig.provenance in packages/kilog/package.json.
      - if: steps.tagpr.outputs.tag != ''
        run: npm publish
        working-directory: packages/kilog
